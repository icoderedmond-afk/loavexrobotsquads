<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D F1 Kart Racing</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #444;
            background-color: #2e7d32;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            gap: 30px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Speed: <span id="speedDisplay">0</span> MPH</div>
        <div>Controls: Arrow Keys or W/A/S/D to Drive</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        if (!ctx) {
            alert("Canvas not supported!");
        }

        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        const kart = {
            x: 400,
            y: 500,
            width: 24,
            height: 40,
            angle: 0,
            speed: 0,
            maxSpeed: 6,
            minSpeed: -2,
            acceleration: 0.1,
            friction: 0.04,
            turnSpeed: 0.045
        };

        function update() {
            // Steering
            if (keys["arrowleft"] || keys["a"]) {
                if (Math.abs(kart.speed) > 0.2) kart.angle -= kart.turnSpeed * (kart.speed / kart.maxSpeed);
            }
            if (keys["arrowright"] || keys["d"]) {
                if (Math.abs(kart.speed) > 0.2) kart.angle += kart.turnSpeed * (kart.speed / kart.maxSpeed);
            }

            // Acceleration
            if (keys["arrowup"] || keys["w"]) {
                kart.speed = Math.min(kart.speed + kart.acceleration, kart.maxSpeed);
            } else if (keys["arrowdown"] || keys["s"]) {
                kart.speed = Math.max(kart.speed - kart.acceleration * 1.5, kart.minSpeed);
            } else {
                if (kart.speed > 0) kart.speed = Math.max(0, kart.speed - kart.friction);
                if (kart.speed < 0) kart.speed = Math.min(0, kart.speed + kart.friction);
            }

            // Movement
            kart.x += Math.sin(kart.angle) * kart.speed;
            kart.y -= Math.cos(kart.angle) * kart.speed;

            // Boundaries
            if (kart.x < 20) kart.x = 20;
            if (kart.x > canvas.width - 20) kart.x = canvas.width - 20;
            if (kart.y < 20) kart.y = 20;
            if (kart.y > canvas.height - 20) kart.y = canvas.height - 20;

            document.getElementById("speedDisplay").innerText = Math.round(Math.abs(kart.speed) * 20);
        }

        function drawTrack() {
            // Grass background is handled by canvas CSS, now draw the track loop
            ctx.strokeStyle = "#424242";
            ctx.lineWidth = 120;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.beginPath();
            ctx.moveTo(400, 520);
            ctx.lineTo(400, 180);
            ctx.arc(300, 180, 100, 0, Math.PI, true);
            ctx.lineTo(200, 420);
            ctx.arc(350, 420, 150, Math.PI, 0, false);
            ctx.lineTo(500, 220);
            ctx.arc(600, 220, 100, Math.PI, 0, true);
            ctx.lineTo(700, 450);
            ctx.stroke();

            // Track borders
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.stroke();

            // Finish Line
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(360, 500, 80, 10);
        }

        function drawKart() {
            ctx.save();
            ctx.translate(kart.x, kart.y);
            ctx.rotate(kart.angle);

            // Tires
            ctx.fillStyle = "#111";
            ctx.fillRect(-14, -14, 5, 10);
            ctx.fillRect(9, -14, 5, 10);
            ctx.fillRect(-15, 8, 5, 12);
            ctx.fillRect(10, 8, 5, 12);

            // Body
            ctx.fillStyle = "#e53935";
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(8, 12);
            ctx.lineTo(-8, 12);
            ctx.closePath();
            ctx.fill();

            // Helmet
            ctx.fillStyle = "#1e88e5";
            ctx.beginPath();
            ctx.arc(0, 2, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            update();
            drawKart();
            requestAnimationFrame(loop);
        }

        // Start loop
        loop();
    </script>
</body>
</html>
